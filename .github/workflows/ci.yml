name: CI

on:
  push:
    branches: [main]
  # Deliberately NO `branches:` filter, unlike `push` above: a stacked pull
  # request targets the branch below it in the stack, not `main`, so a
  # `branches: [main]` filter here silently gave every PR above the bottom of
  # a stack zero checks — the work was reviewed and merged on the strength of
  # local runs alone. Every PR gets the full suite regardless of its base.
  #
  # `concurrency` below needs no change to suit this: for `pull_request`,
  # `github.ref` is `refs/pull/<n>/merge`, which is distinct per PR, so
  # sibling PRs in one stack never cancel each other.
  #
  # Note the workflow FILE used for a `pull_request` run comes from the merge
  # of base+head, so a PR only picks this up once the branch it targets
  # contains it. The bottom PR of a stack (base `main`) gets it immediately;
  # the ones above get it as the stack merges upward, or right away if `main`
  # is merged into the branch beneath them.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.dev.yml config --quiet

  test-client:
    name: Client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm test -w app/client

  test-server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm test -w app/server

  test-scripts:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:scripts

  docker-build:
    name: Docker build (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build for amd64 and arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  docker-smoke-test:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build image
        run: docker build -t scribe:smoke .
      # Shared by the steps below. A well-formed creation body: canonical base64
      # of the right lengths and a sealed wrap ("SCRB" + version 1 + 60 bytes),
      # with no `device` (the browser's setup page sends none). The route
      # validates the body BEFORE it checks the setup code, so only a body
      # like this proves the gate itself: an empty `{}` gets a 400 and proves
      # nothing. Built inside the container so the job needs no tooling beyond
      # docker and curl.
      - name: Prepare helpers
        run: |
          cat > smoke-lib.sh <<'EOF'
          wait_healthy() { # <container>
            for i in $(seq 1 30); do
              if [ "$(docker inspect --format '{{.State.Health.Status}}' "$1")" = "healthy" ]; then
                echo "$1 healthy after $((i * 2))s"
                return 0
              fi
              sleep 2
            done
            echo "$1 never became healthy. Logs:"
            docker logs "$1"
            return 1
          }
          create_body() { # <container> <setup code>
            docker exec "$1" node -e '
              const b = (n) => Buffer.alloc(n).toString("base64");
              const wrap = Buffer.concat([Buffer.from("SCRB"), Buffer.from([1]), Buffer.alloc(60)]).toString("base64");
              console.log(JSON.stringify({
                setupCode: process.argv[1],
                libraryId: crypto.randomUUID(),
                passwordSalt: b(16),
                recoverySalt: b(16),
                authKey: b(32),
                passwordWrap: wrap,
                recoveryCodes: Array.from({ length: 10 }, () => ({ authKey: b(32), wrap })),
              }));
            ' "$2"
          }
          post_create() { # <port> <body> -> prints the HTTP status
            curl -s -o /tmp/create-response.json -w '%{http_code}' \
              -X POST "http://localhost:$1/api/v1/library" \
              -H 'Content-Type: application/json' \
              -d "$2"
          }
          EOF
      - name: Fresh container with no setup code (root-owned mount)
        run: |
          . ./smoke-lib.sh
          # A root-owned host directory stands in for a volume the vault does
          # not own yet; the process must take it over and write as uid 1000.
          mkdir smoke-data && sudo chown root:root smoke-data && sudo chmod 755 smoke-data
          docker run -d --name smoke-closed -p 3000:3000 -v "$PWD/smoke-data:/data" scribe:smoke
          wait_healthy smoke-closed
          OWNER=$(stat -c '%u' smoke-data/db.sqlite)
          if [ "$OWNER" != "1000" ]; then
            echo "Ownership check failed: db.sqlite is owned by uid ${OWNER}, expected 1000"
            exit 1
          fi
          echo "Ownership check passed (db.sqlite owned by uid 1000)"
          STATUS_BODY=$(curl -s http://localhost:3000/api/v1/status)
          if ! echo "$STATUS_BODY" | grep -q '"libraryExists":false'; then
            echo "Status check failed: expected libraryExists:false, got ${STATUS_BODY}"
            exit 1
          fi
          echo "Status check passed (fresh container has no library)"
          # No SETUP_CODE and no options.json: creation must be refused with 403.
          CREATE_STATUS=$(post_create 3000 "$(create_body smoke-closed smoke-setup-code-123)")
          if [ "$CREATE_STATUS" != "403" ]; then
            echo "Setup gate check failed: expected HTTP 403 from POST /api/v1/library, got ${CREATE_STATUS}"
            exit 1
          fi
          echo "Setup gate check passed (closed: got 403 as expected)"
          # The sync surface requires a token.
          CHANGES_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/changes)
          if [ "$CHANGES_STATUS" != "401" ]; then
            echo "Auth check failed: expected HTTP 401 from GET /api/v1/changes without a token, got ${CHANGES_STATUS}"
            exit 1
          fi
          echo "Auth check passed (got 401 as expected)"
          # No https PUBLIC_URL: the MCP endpoint and its OAuth metadata are
          # off, and say so as JSON rather than serving the admin page's HTML.
          MCP_OFF_STATUS=$(curl -s -o /tmp/mcp-off.json -w '%{http_code}' http://localhost:3000/mcp)
          META_OFF_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/.well-known/oauth-authorization-server)
          if [ "$MCP_OFF_STATUS" != "404" ] || [ "$META_OFF_STATUS" != "404" ] || ! grep -q 'MCP is not enabled' /tmp/mcp-off.json; then
            echo "MCP-off check failed: expected 404 JSON from /mcp and the metadata document, got ${MCP_OFF_STATUS} and ${META_OFF_STATUS}: $(cat /tmp/mcp-off.json)"
            exit 1
          fi
          echo "MCP-off check passed (/mcp is a JSON 404 without an https PUBLIC_URL)"
      - name: Container with an https PUBLIC_URL (MCP on)
        run: |
          . ./smoke-lib.sh
          docker run -d --name smoke-mcp -p 3003:3000 -e PUBLIC_URL=https://vault.example scribe:smoke
          wait_healthy smoke-mcp
          # The OAuth issuer is PUBLIC_URL, never the Host header this request carries.
          META=$(curl -s http://localhost:3003/.well-known/oauth-authorization-server)
          if ! echo "$META" | grep -q '"issuer":"https://vault.example/"' || ! echo "$META" | grep -q '"token_endpoint":"https://vault.example/mcp/oauth/token"'; then
            echo "MCP metadata check failed: expected the issuer to be PUBLIC_URL, got ${META}"
            exit 1
          fi
          echo "MCP metadata check passed (issuer is PUBLIC_URL)"
          # POST /mcp without a token is a 401 that points at the resource metadata.
          MCP_STATUS=$(curl -s -D /tmp/mcp-headers.txt -o /dev/null -w '%{http_code}' -X POST http://localhost:3003/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"ping"}')
          if [ "$MCP_STATUS" != "401" ] || ! grep -qi 'www-authenticate: Bearer' /tmp/mcp-headers.txt || ! grep -q 'oauth-protected-resource/mcp' /tmp/mcp-headers.txt; then
            echo "MCP auth check failed: expected 401 with a WWW-Authenticate pointer from POST /mcp, got ${MCP_STATUS}: $(cat /tmp/mcp-headers.txt)"
            exit 1
          fi
          echo "MCP auth check passed (POST /mcp without a token is 401 with WWW-Authenticate)"
          STATUS_BODY=$(curl -s http://localhost:3003/api/v1/status)
          if ! echo "$STATUS_BODY" | grep -q '"mcp":true'; then
            echo "Status check failed: expected mcp:true, got ${STATUS_BODY}"
            exit 1
          fi
          echo "Status check passed (mcp:true)"
      - name: Container with SETUP_CODE set (gate open)
        run: |
          . ./smoke-lib.sh
          docker run -d --name smoke-open -p 3001:3000 -e SETUP_CODE=smoke-setup-code-123 scribe:smoke
          wait_healthy smoke-open
          BODY=$(create_body smoke-open smoke-setup-code-123)
          CREATE_STATUS=$(post_create 3001 "$BODY")
          if [ "$CREATE_STATUS" != "201" ] || ! grep -q '"libraryId"' /tmp/create-response.json; then
            echo "Setup check failed: expected HTTP 201 with a libraryId, got ${CREATE_STATUS}: $(cat /tmp/create-response.json)"
            exit 1
          fi
          echo "Setup check passed (open: created the library without a device)"
          SECOND_STATUS=$(post_create 3001 "$BODY")
          if [ "$SECOND_STATUS" != "409" ]; then
            echo "Second creation check failed: expected HTTP 409, got ${SECOND_STATUS}"
            exit 1
          fi
          echo "Second creation check passed (got 409 as expected)"
      - name: Container as the Home Assistant add-on sees it (root-owned 0600 options.json, data written as root)
        run: |
          . ./smoke-lib.sh
          # The Supervisor writes /data/options.json as root with mode 0600 on
          # every start, and an earlier image may have written the database as
          # root. The process must take both over before it drops privileges,
          # or the setup code is unreadable and the database read-only.
          mkdir addon-data
          echo '{"setup_code":"smoke-setup-code-123","library_dir":"scribe","log_level":"debug"}' > addon-data/options.json
          sudo chown -R root:root addon-data && sudo chmod 600 addon-data/options.json
          mkdir addon-media && sudo chown root:root addon-media
          docker run -d --name smoke-addon -p 3002:3000 \
            -v "$PWD/addon-data:/data" -v "$PWD/addon-media:/media" scribe:smoke
          wait_healthy smoke-addon
          CREATE_STATUS=$(post_create 3002 "$(create_body smoke-addon smoke-setup-code-123)")
          if [ "$CREATE_STATUS" != "201" ]; then
            echo "Add-on setup check failed: expected HTTP 201 with the code from options.json, got ${CREATE_STATUS}: $(cat /tmp/create-response.json)"
            exit 1
          fi
          echo "Add-on setup check passed (setup code read from a root-owned 0600 options.json)"
          BLOB_OWNER=$(stat -c '%u' addon-media/scribe/blobs)
          if [ "$BLOB_OWNER" != "1000" ]; then
            echo "Media ownership check failed: blobs dir owned by uid ${BLOB_OWNER}, expected 1000"
            exit 1
          fi
          echo "Media ownership check passed"
          # Restart: the Supervisor would rewrite options.json as root again.
          docker stop smoke-addon
          sudo chown root:root addon-data/options.json addon-data/db.sqlite
          docker start smoke-addon
          wait_healthy smoke-addon
          STATUS_BODY=$(curl -s http://localhost:3002/api/v1/status)
          if ! echo "$STATUS_BODY" | grep -q '"libraryExists":true'; then
            echo "Restart check failed: expected libraryExists:true after a restart, got ${STATUS_BODY}"
            exit 1
          fi
          RESET_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE http://localhost:3002/api/v1/library \
            -H 'Content-Type: application/json' -d '{"setupCode":"wrong-code-12chars","confirm":"DELETE"}')
          if [ "$RESET_STATUS" != "403" ]; then
            echo "Restart check failed: expected 403 Wrong setup code (the code is readable again), got ${RESET_STATUS}"
            exit 1
          fi
          echo "Restart check passed (root-owned files taken over again on boot)"
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs smoke-closed 2>&1 || true
          docker logs smoke-mcp 2>&1 || true
          docker logs smoke-open 2>&1 || true
          docker logs smoke-addon 2>&1 || true
      - name: Cleanup
        if: always()
        run: docker rm -f smoke-closed smoke-mcp smoke-open smoke-addon 2>/dev/null || true
