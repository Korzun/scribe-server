name: CI

on:
  push:
    branches: [main]
  # Deliberately NO `branches:` filter, unlike `push` above: a stacked pull
  # request targets the branch below it in the stack, not `main`, so a
  # `branches: [main]` filter here silently gave every PR above the bottom of
  # a stack zero checks — the work was reviewed and merged on the strength of
  # local runs alone. Every PR gets the full suite regardless of its base.
  #
  # `concurrency` below needs no change to suit this: for `pull_request`,
  # `github.ref` is `refs/pull/<n>/merge`, which is distinct per PR, so
  # sibling PRs in one stack never cancel each other.
  #
  # Note the workflow FILE used for a `pull_request` run comes from the merge
  # of base+head, so a PR only picks this up once the branch it targets
  # contains it. The bottom PR of a stack (base `main`) gets it immediately;
  # the ones above get it as the stack merges upward, or right away if `main`
  # is merged into the branch beneath them.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test-client:
    name: Client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm test -w app/client

  test-server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm test -w app/server

  test-scripts:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:scripts

  docker-build:
    name: Docker build (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build for amd64 and arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  docker-smoke-test:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build image
        run: docker build -t scribe:smoke .
      - name: Run and verify startup
        run: |
          # No volumes: the image must boot with an empty /data.
          docker run -d --name smoke-test -p 3000:3000 scribe:smoke
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/login -o /dev/null; then
              echo "Server ready after ${i}s"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "Server failed to become ready. Logs:"
              docker logs smoke-test
              docker rm -f smoke-test
              exit 1
            fi
            sleep 1
          done
          # A fresh container has no library yet.
          STATUS_BODY=$(curl -s http://localhost:3000/api/v1/status)
          if ! echo "$STATUS_BODY" | grep -q '"libraryExists":false'; then
            echo "Status check failed: expected libraryExists:false, got ${STATUS_BODY}. Logs:"
            docker logs smoke-test
            docker rm -f smoke-test
            exit 1
          fi
          echo "Status check passed (fresh container has no library)"
          # The image sets no `setup_code`, so creating the library must be
          # refused with 403. This proves the setup-code gate is closed by
          # default, not merely that request validation ran: the route
          # validates the body BEFORE it checks the setup code, so an empty
          # `{}` gets a 400 and proves nothing. The body below is therefore
          # well-formed in every respect (canonical base64 of the right
          # lengths, a sealed wrap: "SCRB" + version 1 + 60 bytes); the only
          # thing wrong with it is that no setup code is configured to match.
          # It is built inside the container so the job needs no tooling
          # beyond docker and curl.
          CREATE_BODY=$(docker exec smoke-test node -e '
            const b = (n) => Buffer.alloc(n).toString("base64");
            const wrap = Buffer.concat([Buffer.from("SCRB"), Buffer.from([1]), Buffer.alloc(60)]).toString("base64");
            console.log(JSON.stringify({
              setupCode: "smoke",
              libraryId: crypto.randomUUID(),
              passwordSalt: b(16),
              recoverySalt: b(16),
              authKey: b(32),
              passwordWrap: wrap,
              recoveryCodes: Array.from({ length: 10 }, () => ({ authKey: b(32), wrap })),
              device: { name: "smoke" },
            }));
          ')
          CREATE_STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:3000/api/v1/library \
            -H 'Content-Type: application/json' \
            -d "$CREATE_BODY")
          if [ "$CREATE_STATUS" != "403" ]; then
            echo "Setup gate check failed: expected HTTP 403 from POST /api/v1/library, got ${CREATE_STATUS}. Logs:"
            docker logs smoke-test
            docker rm -f smoke-test
            exit 1
          fi
          echo "Setup gate check passed (got 403 as expected)"
          # The sync surface requires a token.
          CHANGES_STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:3000/api/v1/changes)
          if [ "$CHANGES_STATUS" != "401" ]; then
            echo "Auth check failed: expected HTTP 401 from GET /api/v1/changes without a token, got ${CHANGES_STATUS}. Logs:"
            docker logs smoke-test
            docker rm -f smoke-test
            exit 1
          fi
          echo "Auth check passed (got 401 as expected)"
          docker stop smoke-test
          docker rm smoke-test
