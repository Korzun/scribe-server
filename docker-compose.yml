# The vault as one container. `cp .env.example .env`, fill in SETUP_CODE and
# PUBLIC_URL, then `docker compose up -d`. Every value here falls back to the
# image's default when the .env line is missing or empty.
#
# The dev stack with live reload is docker-compose.dev.yml (`make dev`).
services:
  scribe:
    build: .
    image: ghcr.io/korzun/scribe-server:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      SETUP_CODE: ${SETUP_CODE:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - scribe-data:/data

# One volume holds everything: the database, in-flight upload parts and the
# encrypted blobs. To keep blobs on a bigger disk, add a second mount (for
# example `- /mnt/big/scribe-blobs:/blobs`) and set `BLOBS_DIR: /blobs` above.
# The health check is built into the image; Compose reports it as `healthy`.
volumes:
  scribe-data:
